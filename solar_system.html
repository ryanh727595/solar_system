let selected=0,quiz=null,paused=false,totalCorrect=0,totalAnswered=0;

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function choose(i){selected=i;quiz=null;document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('active',i===j));const b=DATA[i];details.innerHTML=`<h2>${b.name}</h2><span class="pill">${b.type}</span><h3>📚 Fact file</h3><div class="fact"><b>Temperature:</b> ${b.temp}<br><b>Orbital period:</b> ${i===0?'Not applicable (the Sun is the central star)':b.year}</div><ul>${b.facts.map(f=>`<li>${f}</li>`).join('')}</ul><p class="muted">3D models and distances are not to scale.</p><button id="start">🧠 Start 10-question quiz</button>`;$('start').onclick=startQuiz;}

function renderQuestion(){const q=quiz.questions[quiz.index];quiz.answered=false;details.innerHTML=`<h2>🧠 ${DATA[selected].name} Quiz</h2><div class="pill">Question ${quiz.index+1} of 10</div><p class="muted">Answer choices are shuffled every time you start!</p><div class="progress"><div style="width:${quiz.index*10}%"></div></div><h3>${q.q}</h3><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" style="display:none">${quiz.index===9?'See results':'Next question →'}</button>`;const choices=$('choices');q.options.forEach((opt,j)=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=`${'ABCD'[j]}. ${opt}`;btn.onclick=()=>answer(opt,btn);choices.append(btn)});$('next').onclick=()=>{quiz.index++;if(quiz.index===10)results();else renderQuestion()}}
function answer(opt,btn){if(quiz.answered)return;quiz.answered=true;const q=quiz.questions[quiz.index],good=opt===q.a;if(good){quiz.score++;totalCorrect++}totalAnswered++;$('scoreboard').textContent=`${totalCorrect} / ${totalAnswered} correct`;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.a)b.classList.add('correct')});if(!good)btn.classList.add('wrong');$('feedback').textContent=good?'✅ Correct! Great job!':`💡 The correct answer is: ${q.a}`;$('next').style.display='inline-block'}
